name: iOS App Store screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web bundle and sync iOS assets
        run: |
          npm ci
          node tools/build-table.js
          npx cap sync ios

      - name: Inject the screenshot-only automation script
        run: |
          cp ios/store-listing/screenshot-automation.js ios/App/App/public/screenshot-automation.js
          sed -i '' 's#</body>#<script src="screenshot-automation.js"></script></body>#' ios/App/App/public/index.html
          grep -o 'screenshot-automation' ios/App/App/public/index.html

      - name: Pin the Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: List available simulator device types (diagnostic)
        run: xcrun simctl list devicetypes | grep -i "iphone 1\|ipad pro"

      - name: List pre-created simulator device instances (diagnostic)
        run: xcrun simctl list devices available | grep -i "iphone\|ipad pro"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/simbuild.log"
          APP_PATH=$(find "$RUNNER_TEMP/build" -name "App.app" -path "*iphonesimulator*" | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app at: $APP_PATH"

      - name: Capture iPhone 6.3" screenshots (spray across the whole run)
        run: |
          # "iPhone 16 Pro" (and every other device this project had already
          # used) is no longer among the Xcode-27 image's pre-created
          # simulator INSTANCES (simctl boot/install/launch need a named
          # instance, not just a device TYPE -- confirmed directly via a
          # live diagnostic run, not guessed at: the type still exists, no
          # instance by that name does). "iPhone 17" is this image's base-
          # model successor line, matching "16 Pro"'s rough 6.3" screenshot
          # size class closely enough for this automation's purposes -- the
          # exact Apple screenshot-size-class mapping for the newest device
          # names is worth double-checking before these screenshots are
          # actually submitted to App Store Connect.
          DEVICE="iPhone 17"
          mkdir -p "$RUNNER_TEMP/screenshots/iphone-series"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" com.luckofthedeal.app
          for i in $(seq -w 1 18); do
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/screenshots/iphone-series/frame-$i.png"
          done
          xcrun simctl shutdown "$DEVICE" || true

      - name: Capture iPad 13" screenshots (spray across the whole run)
        run: |
          # Direct generational successor to the M4 model this used to name
          # (same 13-inch display/resolution, confirmed pre-created on this
          # image via the same diagnostic) -- a safe one-to-one swap, unlike
          # the iPhone case above.
          DEVICE="iPad Pro 13-inch (M5)"
          mkdir -p "$RUNNER_TEMP/screenshots/ipad-series"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" com.luckofthedeal.app
          for i in $(seq -w 1 18); do
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/screenshots/ipad-series/frame-$i.png"
          done
          xcrun simctl shutdown "$DEVICE" || true

      - name: Capture an iPhone Duo screenshot (verifies the wide-screen CSS -- not an App Store asset)
        run: |
          # Not a submission asset -- Apple doesn't have a screenshot size
          # class for this device yet. This is purely to directly verify,
          # on Apple's own real foldable simulator, the two-pane wide-
          # screen/foldable CSS landed earlier (gated on min-width + min-
          # aspect-ratio, plus the horizontal-viewport-segments/env()
          # enhancement for a device that reports real hinge geometry) --
          # the actual payoff of this whole Xcode-27 SDK bump, which this
          # project's own build toolchain had no way to render correctly
          # under Xcode 26.2 regardless of CSS.
          DEVICE="iPhone Duo"
          mkdir -p "$RUNNER_TEMP/screenshots/duo-verification"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" com.luckofthedeal.app
          for i in $(seq -w 1 18); do
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/screenshots/duo-verification/frame-$i.png"
          done
          xcrun simctl shutdown "$DEVICE" || true

      - name: Strip alpha channel (Apple rejects screenshots with alpha)
        run: |
          cd "$RUNNER_TEMP/screenshots"
          # --setProperty hasAlpha no doesn't work for PNG output (confirmed:
          # "Error 13: an unknown error occurred" on a real run, 2026-11-25).
          # Converting to JPEG sidesteps it entirely -- JPEG has no alpha
          # channel by definition, so there's nothing to strip.
          find . -name "*.png" | while read -r f; do
            sips -s format jpeg "$f" --out "${f%.png}.jpg"
          done
          find . -name "*.png" -delete

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-screenshots
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: warn
