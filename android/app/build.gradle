apply plugin: 'com.android.application'

// Release signing -- loaded from android/keystore.properties, a local,
// gitignored file (never committed; see android/README.md's "Release
// signing key" section). The release build simply has no signingConfig at
// all when this file is absent, e.g. a fresh clone that hasn't generated
// a keystore yet, rather than failing the build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.luckofthedeal.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.luckofthedeal.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Automated Play Console uploads (Android roadmap step 9). Credentials come
// from android/play-service-account.json -- a local, gitignored Google
// Cloud service-account key (see android/README.md). This block only wires
// up configuration; it does not upload anything on its own. Run
// `./gradlew.bat publishBundle` (or `publishReleaseBundle`) to actually
// upload the current versionCode to the configured track -- a real,
// user-facing action the user should trigger explicitly, not something
// run automatically as part of an ordinary build.
if (rootProject.file("play-service-account.json").exists()) {
    apply plugin: 'com.github.triplet.play'

    play {
        serviceAccountCredentials.set(rootProject.file("play-service-account.json"))
        // Default target is internal testing -- the one track exempt from
        // the "app still in draft state" restriction below, so a plain
        // `./gradlew.bat publishReleaseBundle` always targets it. Publishing
        // to a closed-testing track instead is a deliberate, temporary
        // override (see android/README.md's "Closed testing" section) --
        // change `track` (and uncomment `releaseStatus`) for that, then
        // revert back to this default afterward.
        track.set("internal")
        defaultToAppBundles.set(true)
        // Uncomment when targeting a non-internal track while the app is
        // still in Play Console's "draft" app-state (content questionnaires
        // filled in but not yet formally submitted for review) -- Play only
        // accepts draft-status releases on those tracks until that happens.
        // releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.DRAFT)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
