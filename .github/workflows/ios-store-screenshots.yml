name: iOS App Store screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web bundle and sync iOS assets
        run: |
          npm ci
          node tools/build-table.js
          npx cap sync ios

      - name: Inject the screenshot-only automation script
        run: |
          cp ios/store-listing/screenshot-automation.js ios/App/App/public/screenshot-automation.js
          sed -i '' 's#</body>#<script src="screenshot-automation.js"></script></body>#' ios/App/App/public/index.html
          grep -o 'screenshot-automation' ios/App/App/public/index.html

      - name: Pin the Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: List available simulator device types (diagnostic)
        run: xcrun simctl list devicetypes | grep -i "iphone 1\|ipad pro"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/simbuild.log"
          APP_PATH=$(find "$RUNNER_TEMP/build" -name "App.app" -path "*iphonesimulator*" | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app at: $APP_PATH"

      - name: Capture iPhone 6.3" screenshots (spray across the whole run)
        run: |
          DEVICE="iPhone 16 Pro"
          mkdir -p "$RUNNER_TEMP/screenshots/iphone-series"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" com.luckofthedeal.app
          for i in $(seq -w 1 18); do
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/screenshots/iphone-series/frame-$i.png"
          done
          xcrun simctl shutdown "$DEVICE" || true

      - name: Capture iPad 13" screenshots (spray across the whole run)
        run: |
          DEVICE="iPad Pro 13-inch (M4)"
          mkdir -p "$RUNNER_TEMP/screenshots/ipad-series"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" com.luckofthedeal.app
          for i in $(seq -w 1 18); do
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/screenshots/ipad-series/frame-$i.png"
          done
          xcrun simctl shutdown "$DEVICE" || true

      - name: Strip alpha channel (Apple rejects screenshots with alpha)
        run: |
          cd "$RUNNER_TEMP/screenshots"
          # --setProperty hasAlpha no doesn't work for PNG output (confirmed:
          # "Error 13: an unknown error occurred" on a real run, 2026-11-25).
          # Converting to JPEG sidesteps it entirely -- JPEG has no alpha
          # channel by definition, so there's nothing to strip.
          find . -name "*.png" | while read -r f; do
            sips -s format jpeg "$f" --out "${f%.png}.jpg"
          done
          find . -name "*.png" -delete

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-screenshots
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: warn
