<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Night — Pick a Game</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23082a20'/%3E%3Cg transform='translate(32,35)'%3E%3Crect x='-19' y='-20' width='24' height='34' rx='4' transform='rotate(-16)' fill='%23082a20' stroke='%23e8cd6f' stroke-width='1.8'/%3E%3Crect x='-12' y='-21' width='24' height='34' rx='4' fill='%23082a20' stroke='%23e8cd6f' stroke-width='1.8'/%3E%3Crect x='-5' y='-20' width='24' height='34' rx='4' transform='rotate(16)' fill='%23f4ecd8' stroke='%23d4af37' stroke-width='1.8'/%3E%3Ctext x='4.5' y='-6' font-size='13' text-anchor='middle' fill='%23c0684a' transform='rotate(16 4.5 -6)'%3E%E2%99%A0%3C/text%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

<header class="app-header">
  <h1>
    <svg class="logo-mark" viewBox="0 0 64 64" role="img" aria-label="Card Night">
      <g transform="translate(32,34)">
        <rect x="-19" y="-20" width="24" height="34" rx="4" transform="rotate(-16)" fill="var(--felt-dark)" stroke="var(--gold-soft)" stroke-width="1.5"/>
        <rect x="-12" y="-21" width="24" height="34" rx="4" fill="var(--felt-dark)" stroke="var(--gold-soft)" stroke-width="1.5"/>
        <rect x="-5" y="-20" width="24" height="34" rx="4" transform="rotate(16)" fill="var(--cream)" stroke="var(--gold)" stroke-width="1.5"/>
        <text x="4.5" y="-6" font-size="13" text-anchor="middle" fill="var(--pip)" transform="rotate(16 4.5 -6)">&#9824;</text>
      </g>
    </svg>
    <span>Card Night</span>
  </h1>
  <p class="tagline">Pick the game for poker night.</p>
  <div class="control-group player-count-group">
    <label for="player-count">Players tonight</label>
    <select id="player-count">
      <option value="5">5</option>
      <option value="6" selected>6</option>
      <option value="7">7</option>
      <option value="8">8</option>
    </select>
  </div>
</header>

<main id="list-view" class="view">

  <section class="controls">
    <div class="control-group filters" id="category-filters" role="group" aria-label="Filter by category">
      <!-- category buttons injected by app.js -->
    </div>

    <button id="pick-for-me" class="pick-button">🎲 Pick for me</button>
  </section>

  <section id="game-grid" class="game-grid"></section>

  <p id="empty-state" class="empty-state" hidden>No games match those filters.</p>

</main>

<main id="detail-view" class="view" hidden>
  <div class="detail-nav-row">
    <button id="back-button" class="back-button">← Back to all games</button>
    <div class="detail-pager">
      <button id="prev-game" class="pager-button" aria-label="Previous game">← Prev</button>
      <button id="next-game" class="pager-button" aria-label="Next game">Next →</button>
    </div>
  </div>
  <article id="detail-content"></article>
  <div class="detail-pager detail-pager-bottom">
    <button id="prev-game-bottom" class="pager-button" aria-label="Previous game">← Prev</button>
    <button id="next-game-bottom" class="pager-button" aria-label="Next game">Next →</button>
  </div>
</main>

<div id="hand-rankings-modal" class="modal-overlay" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="hand-rankings-title">
    <div class="modal-header">
      <h2 id="hand-rankings-title">🏆 Poker Hand Rankings</h2>
      <button id="close-hand-rankings" class="modal-close" aria-label="Close">✕</button>
    </div>
    <p class="modal-subtitle">Best to worst, 5-card hands.</p>
    <div id="hand-rankings-list" class="hand-rankings-list"></div>
  </div>
</div>

<script src="games-data.js"></script>
<script src="app.js"></script>
</body>
</html>
