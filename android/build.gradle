// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Automated Play Console uploads (Android roadmap step 9) -- see
// app/build.gradle's `play { ... }` block and android/README.md. Declared
// via the plugins{} block (not buildscript classpath) because this plugin
// is only published as a Gradle Plugin Portal marker artifact, which that
// block resolves correctly; `apply false` here since it's actually applied
// per-module, inside app/build.gradle.
plugins {
    id 'com.github.triplet.play' version '3.13.0' apply false
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
